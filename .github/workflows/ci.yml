name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check . --output-format=github

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install PyTorch (CPU wheel on Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch (Windows / macOS)
        if: runner.os != 'Linux'
        run: pip install torch
      - name: Install dependencies
        run: pip install numpy pygame pytest pytest-cov
      - name: Run tests with coverage
        run: python -m pytest --cov=zahhak_snakehandler --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: End-to-end smoke (train, resume, evaluate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pygame
      - name: Train 30 episodes headless
        run: python -m zahhak_snakehandler.train --episodes 30 --seed 1 --device cpu
      - name: Resume for 10 more episodes
        run: python -m zahhak_snakehandler.train --resume checkpoints/Zahhak-snakehandler_latest.pt --episodes 10 --device cpu
      - name: Evaluate checkpoint against the random baseline
        run: python -m zahhak_snakehandler.evaluate --model checkpoints/Zahhak-snakehandler_latest.pt --episodes 10 --device cpu
      - name: Verify the GPU preset parses (CPU fallback)
        run: python -m zahhak_snakehandler.train --preset gpu --device cpu --episodes 5 --seed 1

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, package, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."; exit 1
          fi

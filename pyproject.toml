[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zahhak-snakehandler"
version = "1.1.0"
description = "Zahhak-snakehandler: a Double-DQN agent that learns Snake, with a Pygame dashboard, fast headless training and CPU/GPU support."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["reinforcement-learning", "dqn", "snake", "pytorch", "pygame", "cuda"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment :: Arcade",
]
dependencies = ["pygame>=2.5", "torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/kheradafrouz/Zahhak-snakehandler"
Issues = "https://github.com/kheradafrouz/Zahhak-snakehandler/issues"
Changelog = "https://github.com/kheradafrouz/Zahhak-snakehandler/blob/main/CHANGELOG.md"

[project.scripts]
zahhak-gui = "zahhak_snakehandler.main:main"
zahhak-train = "zahhak_snakehandler.train:main"
zahhak-eval = "zahhak_snakehandler.evaluate:main"

[tool.setuptools.packages.find]
include = ["zahhak_snakehandler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["zahhak_snakehandler"]
omit = ["zahhak_snakehandler/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Correctness-focused rules: syntax errors, undefined names, unused imports, E7 statement issues.
select = ["E4", "E7", "E9", "F"]
